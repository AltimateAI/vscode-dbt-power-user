on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  release:
    types:
      - created

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            vsce-target: darwin-arm64
          - os: ubuntu-latest
            vsce-target: linux-x64
          - os: windows-latest
            vsce-target: win32-x64
          - os: ubuntu-24.04-arm
            vsce-target: linux-arm64
          # Packaged on Linux, as the release jobs do. The runner can't load its
          # addons, so it gets the content and size check only.
          - os: ubuntu-latest
            vsce-target: darwin-x64
            cross: true
    runs-on: ${{ matrix.os }}
    # Runs PR code (build, package): read-only token. Statuses and comments are posted by
    # bundle-size-report, which never checks out or runs PR code.
    permissions:
      contents: read
    steps:
      # The VSIX built here is the one published, so check out with LF line endings
      # on Windows too, as on the Linux runners that used to build every release.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run common build steps
        uses: ./.github/actions/common-build
        with:
          vsce-target: ${{ matrix.vsce-target }}
      # A pre-release must be packaged as one: `publish --packagePath` can't mark it.
      - name: Build and package VSIX
        run: npx @vscode/vsce package --target ${{ matrix.vsce-target }} ${{ github.event_name == 'release' && github.event.release.prerelease && '--pre-release' || '' }}
        env:
          VSCE_TARGET: ${{ matrix.vsce-target }}
          NODE_OPTIONS: --max-old-space-size=8192
      # The VSIX ships only dist's node_modules, so load zeromq from the unpacked VSIX,
      # outside the checkout, to catch a runtime dependency the build didn't copy. Node
      # also searches every parent directory's node_modules, so fail when any module
      # zeromq loads comes from outside the VSIX.
      - name: Load zeromq from the packaged VSIX
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          dir="$RUNNER_TEMP/vsix-check"
          rm -rf "$dir" && mkdir -p "$dir"
          unzip -q ./*.vsix -d "$dir"
          cd "$RUNNER_TEMP"
          node -e '
            const path = require("path");
            const root = path.resolve(process.argv[1]);
            const z = require(path.join(root, "extension/dist/node_modules/zeromq"));
            new z.Dealer().close();
            const outside = Object.keys(require.cache).filter((file) => {
              const rel = path.relative(root, file);
              return rel.startsWith("..") || path.isAbsolute(rel);
            });
            if (outside.length > 0) {
              console.error("zeromq loaded modules from outside the VSIX: " + outside.join(", "));
              process.exit(1);
            }
            console.log("zeromq loads from the VSIX, libzmq " + z.version);
          ' "$dir"
      - name: Analyze bundle size
        id: analyze
        run: python3 .github/scripts/analyze-vsix.py
      - name: Restore master baseline
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: master-baseline.json
          key: bundle-size-baseline-${{ matrix.vsce-target }}-will-not-match
          restore-keys: bundle-size-baseline-${{ matrix.vsce-target }}-
      - name: Save master baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: bundle-baseline.json
          key: bundle-size-baseline-${{ matrix.vsce-target }}-${{ github.sha }}
      - name: Generate report
        id: report
        run: python3 .github/scripts/generate-bundle-report.py
        env:
          VSCE_TARGET: ${{ matrix.vsce-target }}
      - name: Record status description
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          # Produced from the PR tree: written as data for bundle-size-report.
          STATUS_DESC: ${{ steps.report.outputs.status_desc }}
        run: printf '%s' "$STATUS_DESC" > bundle-status.txt
      - name: Upload report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report-${{ matrix.vsce-target }}
          path: |
            bundle-report.md
            bundle-status.txt
          retention-days: 1
      - name: Job summary
        shell: bash
        run: cat bundle-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Check VSIX size and contents
        shell: bash
        run: python3 .github/scripts/check-vsix.py ./*.vsix ${{ matrix.vsce-target }}
      # Only a VSIX that passed every step above is uploaded, with its checksum. The
      # publish jobs publish exactly this file.
      - name: Record VSIX checksum
        if: github.event_name == 'pull_request' || github.event_name == 'release'
        shell: bash
        run: python3 .github/scripts/release-vsix.py record ./*.vsix
      - name: Upload checked VSIX
        if: github.event_name == 'pull_request' || github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.vsce-target }}
          path: |
            *.vsix
            *.vsix.sha256
          if-no-files-found: error
          retention-days: 14
          # "Re-run all jobs" uploads again under the same name; v4 artifacts are
          # immutable, so replace the earlier attempt's instead of failing.
          overwrite: true
      - name: Upload unchecked VSIX
        if: failure() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.vsce-target }}-unchecked
          path: "*.vsix"
          retention-days: 7
          overwrite: true

  bundle-size-report:
    needs: build
    runs-on: ubuntu-latest
    # !cancelled(): still report the targets that built when another matrix leg failed.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      pull-requests: write
      statuses: write  # "Bundle Size (<target>)" commit statuses
    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          pattern: bundle-report-*
      - name: Combine reports
        run: |
          echo "## Bundle Size Report" > combined-report.md
          echo "" >> combined-report.md
          for dir in bundle-report-*/; do
            cat "$dir/bundle-report.md" >> combined-report.md
            echo "" >> combined-report.md
          done
      - name: Set commit statuses
        uses: actions/github-script@v7
        with:
          script: |
            // Artifacts come from the PR build: read them as data only.
            const fs = require('fs');
            // Keep in sync with build.matrix: a fixed list, because code in the build job can upload
            // extra artifacts and must not choose status names.
            const targets = ['darwin-arm64', 'linux-x64', 'win32-x64', 'darwin-x64', 'linux-arm64'];
            for (const target of targets) {
              const file = `bundle-report-${target}/bundle-status.txt`;
              if (!fs.existsSync(file)) continue;
              const desc = fs.readFileSync(file, 'utf8').replace(/[\r\n]+/g, ' ').slice(0, 140);
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.payload.pull_request.head.sha,
                state: 'success',
                description: desc,
                context: `Bundle Size (${target})`,
                target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            }
      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('combined-report.md', 'utf8');
            const marker = '<!-- bundle-size-report -->';
            const body = marker + '\n' + report;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # Rehearses the publish jobs on every PR: downloads each checked VSIX and runs the
  # same verification and retry wrapper. No publish token is referenced here.
  release-dry-run:
    needs: build
    runs-on: ubuntu-latest
    if: success() && github.event_name == 'pull_request'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - darwin-arm64
          - darwin-x64
          - linux-arm64
          - linux-x64
          - win32-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download checked VSIX
        uses: actions/download-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: vsix
      # A PR has no tag: package.json's version stands in for it.
      - name: Verify checked VSIX
        id: vsix
        run: python3 .github/scripts/release-vsix.py verify vsix "$TARGET" "$(node -p "require('./package.json').version")" false
        env:
          TARGET: ${{ matrix.target }}
      # These two steps print retry.sh's output without its `::warning::` and
      # `::error::` prefixes, so the expected failures raise no workflow annotations.
      - name: Retry a command that fails twice, then succeeds
        env:
          RETRY_DELAYS: "1 1"
        run: |
          cat > flaky.sh <<'EOF'
          n=$(( $(cat attempts 2>/dev/null || echo 0) + 1 ))
          echo "$n" > attempts
          [ "$n" -ge 3 ]
          EOF
          status=0
          .github/scripts/retry.sh bash flaky.sh > retry.log 2>&1 || status=$?
          sed 's/^::\([a-z]*\)::/  \1: /' retry.log
          [ "$status" = 0 ] && [ "$(cat attempts)" = 3 ]
      - name: Stop after three failed attempts
        env:
          RETRY_DELAYS: "1 1"
        run: |
          .github/scripts/retry.sh false > retry.log 2>&1 && exit 1
          sed 's/^::\([a-z]*\)::/  \1: /' retry.log
          grep -q "failed after 3 attempts" retry.log
      - name: Show the publish commands (not run)
        env:
          VSIX: ${{ steps.vsix.outputs.vsix }}
        run: |
          echo "would run: .github/scripts/retry.sh npx vsce publish --packagePath $VSIX --skip-duplicate"
          echo "would run: .github/scripts/retry.sh npx ovsx publish $VSIX --skip-duplicate"

  release-vsstudio-marketplace:
    needs: build
    runs-on: ubuntu-latest
    if: success() && github.event_name == 'release' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - darwin-arm64
          - darwin-x64
          - linux-arm64
          - linux-x64
          - win32-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      # Only the publish CLIs at their lockfile versions; nothing is built here.
      - name: Install vsce and ovsx
        run: npm ci --ignore-scripts
      - name: Verify package.json version matches release tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match release tag ($TAG_VERSION). Bump package.json before tagging — vsce publishes the version from package.json, not the tag."
            exit 1
          fi
          echo "package.json version $PKG_VERSION matches tag $TAG_VERSION"
      - name: Download checked VSIX
        uses: actions/download-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: vsix
      - name: Verify checked VSIX
        id: vsix
        run: python3 .github/scripts/release-vsix.py verify vsix "$TARGET" "$GITHUB_REF_NAME" "$PRE_RELEASE"
        env:
          TARGET: ${{ matrix.target }}
          PRE_RELEASE: ${{ github.event.release.prerelease }}
      # --skip-duplicate makes a retry after an attempt that did land a no-op.
      - name: Publish Visual Studio Marketplace
        run: .github/scripts/retry.sh npx vsce publish --packagePath "$VSIX" --skip-duplicate ${PRE_RELEASE:+"$PRE_RELEASE"}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSIX: ${{ steps.vsix.outputs.vsix }}
          PRE_RELEASE: ${{ github.event.release.prerelease && '--pre-release' || '' }}

  release-openvsx-marketplace:
    needs: build
    runs-on: ubuntu-latest
    if: success() && github.event_name == 'release' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - darwin-arm64
          - darwin-x64
          - linux-arm64
          - linux-x64
          - win32-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      # Only the publish CLIs at their lockfile versions; nothing is built here.
      - name: Install vsce and ovsx
        run: npm ci --ignore-scripts
      - name: Verify package.json version matches release tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match release tag ($TAG_VERSION). Bump package.json before tagging — ovsx publishes the version from package.json, not the tag."
            exit 1
          fi
          echo "package.json version $PKG_VERSION matches tag $TAG_VERSION"
      - name: Download checked VSIX
        uses: actions/download-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: vsix
      - name: Verify checked VSIX
        id: vsix
        run: python3 .github/scripts/release-vsix.py verify vsix "$TARGET" "$GITHUB_REF_NAME" "$PRE_RELEASE"
        env:
          TARGET: ${{ matrix.target }}
          PRE_RELEASE: ${{ github.event.release.prerelease }}
      # Open VSX reads the pre-release flag from the VSIX. --skip-duplicate makes a
      # retry after an attempt that did land a no-op.
      - name: Publish OpenVSX Marketplace
        run: .github/scripts/retry.sh npx ovsx publish "$VSIX" --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSIX: ${{ steps.vsix.outputs.vsix }}

  # Single release notification across both marketplaces, now including the
  # release notes body. Kept inline (not the shared AltimateAI/ci-workflows
  # reusable) because this is a public repo and that reusable is private.
  release-notify:
    runs-on: ubuntu-latest
    needs: [release-vsstudio-marketplace, release-openvsx-marketplace]
    if: always() && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Get release notes for Slack
        id: get_release_notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_TAG=${{ github.ref_name }}
          if RELEASE_NOTES=$(gh release view "$CURRENT_TAG" --json body --jq '.body' 2>/dev/null) \
             && [ -n "$RELEASE_NOTES" ] && [ "$RELEASE_NOTES" != "null" ]; then
            SLACK_TEXT="🚀 *Release $CURRENT_TAG*\n\n$RELEASE_NOTES"
          else
            SLACK_TEXT="🚀 *Release $CURRENT_TAG*\n\nNo release notes provided."
          fi
          {
            echo "slack_message<<SLACK_EOF"
            echo -e "$SLACK_TEXT"
            echo "SLACK_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Send Slack notification
        if: ${{ always() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ (needs.release-vsstudio-marketplace.result == 'success' && needs.release-openvsx-marketplace.result == 'success') && 'success' || 'failure' }}
          text: |
            Tag: ${{ github.ref_name }} release to VS Marketplace + OpenVSX status: ${{ (needs.release-vsstudio-marketplace.result == 'success' && needs.release-openvsx-marketplace.result == 'success') && 'succeeded' || 'failed' }} :${{ (needs.release-vsstudio-marketplace.result == 'success' && needs.release-openvsx-marketplace.result == 'success') && 'tada' || 'disappointed' }}:

            ${{ steps.get_release_notes.outputs.slack_message }}
