name: aireceipts
on: [pull_request]
permissions:
  contents: read
  pull-requests: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the reviewed release: pr-check runs with a PR-write token. Bump deliberately.
      - run: npx -y aireceipts-cli@0.11.0 pr-check
        env:
          GH_TOKEN: ${{ github.token }}
